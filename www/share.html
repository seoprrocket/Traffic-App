<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Live Drive</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen map with one arrival card pinned to the bottom */
:root{--bg:#eef2f5;--surface:#fff;--fg:#13202b;--muted:#56687a;--line:#cfd8e0;--you:#1d6cf0;--ok:#18804f;--danger:#d42a2a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1720;--surface:#15212c;--fg:#e6edf3;--muted:#8ea1b2;--line:#26384a;--you:#4d8eff;--ok:#3cc486;--danger:#ff5a4e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1720;--surface:#15212c;--fg:#e6edf3;--muted:#8ea1b2;--line:#26384a;--you:#4d8eff;--ok:#3cc486;--danger:#ff5a4e;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body)}
#map{position:fixed;inset:0}
.card{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:500;max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 8px 28px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:4px}
.card small{color:var(--muted);font-size:13px}
.who{font-size:14px;color:var(--muted)}
.eta{font:700 34px/1.05 var(--display);font-variant-numeric:tabular-nums}
.eta.done{color:var(--ok)}
.bad{color:var(--danger)}
.car{width:22px;height:22px;border-radius:50%;background:var(--you);border:3px solid #fff;box-shadow:0 0 0 6px rgba(29,108,240,.25)}
.dest{font-size:26px;line-height:1}
.brand{font:700 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div id="map"></div>
<div class="card" id="card" role="status" aria-live="polite">
  <span class="brand">Ticket Radar · live drive</span>
  <div class="who" id="who">Loading…</div>
  <div class="eta" id="eta"></div>
  <small id="meta"></small>
</div>
<script src="vendor/leaflet.js"></script>
<script type="module" src="js/share-view.js"></script>
</body>
</html>
