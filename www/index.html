<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Speed-camera and ticket-zone warnings for Washington DC, Maryland and Virginia drivers.">
<title>Invictus Traffic Radar</title>
<meta name="apple-mobile-web-app-title" content="Invictus Radar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1><span class="kicker">Invictus </span>Traffic Radar</h1><small>Maryland, Washington DC &amp; Virginia (DMV)</small></div>
    <button class="chip" id="driveBtn" aria-pressed="false"><span class="dot"></span><span id="driveLbl">Start drive</span></button>
    <button class="iconbtn" id="setBtn" aria-label="Settings">⚙︎</button>
  </header>

  <main>
    <section class="view mapview" id="view-map">
      <div id="map" class="mapbox"></div>
      <div class="mapsearch" id="mapsearch">
        <div class="ms-bar"><span class="ms-glass" aria-hidden="true">🔍</span><input id="ms-q" type="search" placeholder="Search or say a place, camera, street" autocomplete="off" aria-label="Search cameras, streets and addresses"><button id="ms-x" type="button" aria-label="Clear search" hidden>✕</button><button id="ms-mic" type="button" aria-label="Talk to the map">🎤</button></div>
        <div class="ms-res" id="ms-res" hidden></div>
      </div>
      <div class="speedo" id="speedo" hidden>
        <div class="sign" id="spdSign"><b>YOUR SPEED</b><i id="spdVal">0</i></div>
        <div class="sign" id="limSign" hidden><b>SPEED LIMIT</b><i id="limVal">25</i></div>
      </div>
      <div class="maptools">
        <button id="locBtn" aria-label="Center on me">◎</button>
        <button id="fitBtn" aria-label="Show all markers">⤢</button>
        <button id="hfBtn" aria-label="Hands-free screen">▣</button>
        <button id="parkBtn" aria-label="Parking">🅿️</button>
        <button id="micBtn" class="mic" aria-label="Voice command" hidden>🎤</button>
        <button id="compass" class="compass" aria-label="Compass: true north is up, the blue arrow is your direction of travel" title="True north is up. Blue arrow: the way you're travelling.">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="29" class="cp-ring"/>
            <g class="cp-ticks"><line x1="61" y1="32" x2="55" y2="32"/><line x1="32" y1="61" x2="32" y2="55"/><line x1="3" y1="32" x2="9" y2="32"/></g>
            <line x1="32" y1="3" x2="32" y2="11" class="cp-north"/>
            <text x="32" y="21" class="cp-n">N</text>
            <g id="cp-dir" class="cp-dir" hidden><polygon points="32,12 42,44 32,37 22,44" class="cp-arrow"/></g>
            <circle cx="32" cy="32" r="3" class="cp-hub"/>
          </svg>
          <b id="cp-txt">—</b>
        </button>
      </div>
      <div class="legend">
        <div><span class="sw" style="background:var(--you);border-radius:50%"></span>You</div>
        <div><span class="sw" style="background:var(--danger)"></span>Ticket spot</div>
        <div><span class="sw" style="background:var(--warn)"></span>Camera</div>
        <div><span class="sw" style="background:#0d9488;border-radius:50%"></span>Driven past</div>
        <div><span class="sw" style="background:#f59e0b;border-radius:50%"></span>Saved place</div>
        <div><span class="sw" style="background:var(--report)"></span>Community</div>
        <div><span class="sw" style="background:#7a3fd1"></span>Parking ticket</div>
      </div>
      <div class="pickbar" id="pickbar" hidden>Tap the map where it is <button id="pickCancel">Cancel</button></div>
      <div class="etabar" id="etabar" hidden></div>
      <button class="fab" id="fab" aria-label="Add ticket, camera or report">+</button>
    </section>

    <section class="view" id="view-list" hidden><div class="wrap">
      <div class="seg" id="listSeg">
        <button data-k="tickets" aria-pressed="true">Tickets</button>
        <button data-k="cameras" aria-pressed="false">Cameras</button>
        <button data-k="roads" aria-pressed="false">My roads</button>
      </div>
      <div class="sec" id="listBody"></div>
    </div></section>

    <section class="view" id="view-stats" hidden><div class="wrap" id="statsBody"></div></section>

    <section class="view" id="view-route" hidden><div class="wrap" id="p-drive"></div></section>

    <section class="view" id="view-more" hidden><div class="wrap" id="moreBody"></div></section>

    <section class="view" id="view-parking" hidden><div class="wrap" id="p-parking"></div></section>
    <section class="view" id="view-import" hidden><div class="wrap" id="p-import"></div></section>
    <section class="view" id="view-saved" hidden><div class="wrap" id="p-saved"></div></section>
    <section class="view" id="view-add-location" hidden><div class="wrap" id="p-add"></div></section>
    <section class="view" id="view-driver-profile" hidden><div class="wrap" id="p-profile"></div></section>
    <section class="view" id="view-account" hidden><div class="wrap" id="p-account"></div></section>
    <section class="view mapview" id="view-community-map" hidden>
      <div id="cmap" class="mapbox"></div>
      <div class="mapchips" id="cmapChips"></div>
      <div class="mapnote" id="cmapNote"></div>
      <button class="fab" id="cmapFab" aria-label="Report a sighting" style="bottom:64px">+</button>
    </section>
    <section class="view" id="view-driving-coach" hidden><div class="wrap" id="p-coach"></div></section>
    <section class="view" id="view-dispute" hidden><div class="wrap" id="p-dispute"></div></section>
    <section class="view" id="view-reporting-feed" hidden><div class="wrap" id="p-feed"></div></section>
    <section class="view" id="view-saved-routes" hidden><div class="wrap" id="p-routes"></div></section>
    <section class="view" id="view-data-export" hidden><div class="wrap" id="p-export"></div></section>
    <section class="view" id="view-safety-tips" hidden><div class="wrap" id="p-tips"></div></section>
    <section class="view" id="view-alert-log" hidden><div class="wrap" id="p-log"></div></section>
    <section class="view" id="view-my-contributions" hidden><div class="wrap" id="p-contrib"></div></section>
    <section class="view mapview" id="view-risk-heatmap" hidden>
      <div id="hmap" class="mapbox"></div>
      <div class="mapchips" id="hmapChips"></div>
      <div class="mapnote" id="hmapNote"></div>
    </section>
    <section class="view" id="view-commute-schedules" hidden><div class="wrap" id="p-commute"></div></section>
    <section class="view" id="view-privacy" hidden><div class="wrap" id="p-privacy"></div></section>
    <section class="view" id="view-terms" hidden><div class="wrap" id="p-terms"></div></section>
  </main>

  <nav role="tablist">
    <button data-v="map" aria-selected="true"><span>🗺</span>Map</button>
    <button data-v="list" aria-selected="false"><span>☰</span>List</button>
    <button data-v="stats" aria-selected="false"><span>📊</span>Stats</button>
    <button data-v="route" aria-selected="false"><span>🚗</span>Drive</button>
    <button data-v="more" aria-selected="false"><span>⋯</span>More</button>
  </nav>
</div>

<!-- Hands-free driving screen -->
<div id="handsfree" hidden>
  <div class="hf-top"><button id="hf-map">Show map</button><button id="hf-stop">Stop drive</button></div>
  <div class="hf-mid">
    <div class="hf-speed"><span id="hf-speed">–</span><small>MPH</small></div>
    <div id="hf-limit" hidden><span>SPEED LIMIT</span><b></b></div>
    <div class="hf-dir"><span id="hf-dir-arrow" aria-hidden="true">➤</span><b id="hf-dir">—</b><small>heading · true north</small></div>
    <div id="hf-next"></div>
    <div id="hf-eta" class="etabar hf" hidden></div>
  </div>
  <div class="hf-btns">
    <button id="hf-voice"><span>🎤</span>Voice</button>
    <button id="hf-police"><span>🚓</span>Police</button>
    <button id="hf-hazard"><span>🚧</span>Hazard</button>
  </div>
</div>
<div id="layer"></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-heat.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
