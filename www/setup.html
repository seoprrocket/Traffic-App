<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ticket Radar Setup</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
/* Layout: single scrolling column of numbered setup steps, a sticky summary bar on top, live health at the bottom */
html,body{height:auto;min-height:100%}
body{padding-inline:16px}
.shell{max-width:760px;margin:0 auto;padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font:700 34px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.top p{margin:4px 0 0;color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.meter{flex:1;min-width:140px;height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .4s}
.bar b{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.step>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px}
.step>summary::-webkit-details-marker{display:none}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 18px/1 var(--display);background:var(--surface2);color:var(--muted)}
.step[data-s="done"] .num{background:var(--ok);color:#fff}
.step[data-s="warn"] .num{background:var(--warn);color:#111}
.step>summary .t{flex:1;min-width:0}
.step>summary h2{margin:0;font:700 21px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.step>summary p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--ok);color:#fff}
.pill.warn{background:var(--warn);color:#111}
.pill.todo{background:var(--danger);color:#fff}
.body{padding:0 16px 16px 62px;display:flex;flex-direction:column;gap:12px}
@media (max-width:520px){.body{padding-left:16px}}
.body ol,.body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.checks li::before{content:"";flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;background:var(--surface2);border:2px solid var(--line)}
.checks li.c-ok::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--surface)}
.checks li.c-bad::before{background:var(--danger);border-color:var(--danger);box-shadow:inset 0 0 0 3px var(--surface)}
.checks li.c-maybe::before{background:var(--warn);border-color:var(--warn);box-shadow:inset 0 0 0 3px var(--surface)}
.checks small{display:block;color:var(--muted)}
.code{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
.code pre{margin:0;padding:12px 12px 12px 12px;overflow-x:auto;font:13px/1.5 var(--mono);white-space:pre}
.code .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface2);color:var(--fg)}
.links a::after{content:" ↗"}
.danger{border:1px solid var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--surface));border-radius:12px;padding:12px;font-size:13px}
.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.small{font-size:13px}
.tbl td,.tbl th{white-space:nowrap}
.linkish{background:none;border:0;padding:0;font:inherit;color:var(--you);text-decoration:underline;cursor:pointer}
.step h3,.card h3{margin:8px 0 4px;font-size:15px}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div><h1>Ticket Radar Setup</h1><p>Connect Supabase and Netlify. Each step checks itself.</p></div>
    <a class="btn" href="./">Open the app</a>
  </div>
  <div class="bar"><div class="meter"><i id="meter" style="width:0"></i></div><b id="count">0 of 7 done</b><button class="btn primary" id="checkAll">Check everything</button></div>
  <div id="steps"></div>
  <section class="card" id="healthCard" hidden><h2>Live health</h2><div id="health"></div></section>
  <p class="note small">This page only uses your public (anon) key. It shows yes/no flags and counts, never secret values. You can remove it from the site once setup is done.</p>
</div>
<script src="js/config.js"></script>
<script type="module" src="js/setup.js"></script>
</body>
</html>
